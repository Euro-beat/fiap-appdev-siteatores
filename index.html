<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Séries</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Catálogo de Séries</h1>
  <p class="subtitulo">API TVmaze</p>

  <div class="controles">
    <input type="text" class="busca" placeholder="Buscar por título..." oninput="aplicarFiltros()">
    <select class="select-genero" onchange="aplicarFiltros()">
      <option value="todos">Todos os gêneros</option>
      <option value="Ação">Ação</option>
      <option value="Anime">Anime</option>
      <option value="Aventura">Aventura</option>
      <option value="Comédia">Comédia</option>
      <option value="Drama">Drama</option>
      <option value="Ficção Científica">Ficção Científica</option>
      <option value="Mistério">Mistério</option>
      <option value="Natureza">Natureza</option>
      <option value="Terror">Terror</option>
    </select>
  </div>

  <p class="contador"></p>

  <div class="grid-series"></div>

  <script src="series.js"></script>
  <script src="script.js"></script>
</body>
</html>
